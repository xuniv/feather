name: Validate Signing

on:
  push:
    branches: [fix/local-install-and-bundle-signing, fix/local-install-handoff]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Entitlements and binary processing
        run: |
          swiftc Feather/Utilities/Signing/EntitlementPolicy.swift Feather/Utilities/Signing/MachOCompatibility.swift Tests/Signing/main.swift -o "$RUNNER_TEMP/signing-tests"
          "$RUNNER_TEMP/signing-tests"
      - name: Native signing core and local TLS
        run: bash Tests/Signing/native.sh
      - name: Installation handoff and hosted manifest encoding
        run: |
          swiftc Feather/Backend/Server/InstallationTransport.swift Tests/Installation/main.swift -o "$RUNNER_TEMP/installation-tests"
          "$RUNNER_TEMP/installation-tests"
      - name: Local installation listeners
        run: bash Tests/Installation/integration.sh
      - name: Unsigned IPA validation
        run: python3 Tests/Signing/test_unsigned_ipa.py
      - name: Swift package adapter
        run: swift build --package-path Zsign
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
      - name: Build iOS without signing credentials
        run: |
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/FeatherBuild" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO
