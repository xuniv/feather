name: Release Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Feather.xcconfig (for example v2.9.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Validate release version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'^FEATHER_PROJECT_VERSION=(\d+\.\d+\.\d+)$', Path('Feather.xcconfig').read_text(), re.M).group(1)
          if tag != 'v' + version:
              raise SystemExit('The release tag must match Feather.xcconfig')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Signing and packaging regressions
        run: |
          swiftc Feather/Utilities/Signing/EntitlementPolicy.swift Feather/Utilities/Signing/MachOCompatibility.swift Tests/Signing/main.swift -o "$RUNNER_TEMP/signing-tests"
          "$RUNNER_TEMP/signing-tests"
          bash Tests/Signing/native.sh
          python3 Tests/Signing/test_unsigned_ipa.py
      - name: Build without signing credentials
        run: |
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/FeatherBuild" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$RELEASE_VERSION" DSTROOT="$RUNNER_TEMP/FeatherUnsigned" \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO
      - name: Package and verify unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Release"
          python3 scripts/unsigned_ipa.py prepare "$RUNNER_TEMP/FeatherUnsigned/Applications/Feather.app" \
            "$RUNNER_TEMP/Release/Feather-unsigned.ipa" --version "$RELEASE_VERSION"
          cd "$RUNNER_TEMP/Release"
          shasum -a 256 Feather-unsigned.ipa > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/Release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-ipa
          path: release
      - name: Verify downloaded asset
        run: |
          cd release
          sha256sum --check SHA256SUMS
          python3 ../scripts/unsigned_ipa.py verify Feather-unsigned.ipa --version "${RELEASE_TAG#v}"
      - name: Publish verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to replace it.' >&2
            exit 1
          fi
          if existing_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            test "$existing_sha" = "$RELEASE_SHA"
          fi
          gh release create "$RELEASE_TAG" release/Feather-unsigned.ipa release/SHA256SUMS \
            --target "$RELEASE_SHA" --title "Feather ${RELEASE_TAG#v} (unsigned)" \
            --notes-file .github/UNSIGNED_RELEASE_NOTES.md --draft
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 2
          gh release edit "$RELEASE_TAG" --draft=false --latest
